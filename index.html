<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; overflow: hidden;
    background: #E40303; color: #fff;
    animation: troca 0.2s step-end infinite;
  }
  body.quadro { animation: none;
  }
  @keyframes troca {
    0.00% { background-color: #E40303; color: #FFFFFF; }
    16.67% { background-color: #FF8C00; color: #000000; }
    33.33% { background-color: #FFED00; color: #000000; }
    50.00% { background-color: #008026; color: #FFFFFF; }
    66.67% { background-color: #24408E; color: #FFFFFF; }
    83.33% { background-color: #732982; color: #FFFFFF; }
    100% { background-color: #E40303; color: #FFFFFF; }
  }
  svg { width: min(86vw, 112vh, 900px); height: auto; display: block; }
  @media (prefers-reduced-motion: reduce) { body { animation-duration: 12s; } }
  .vz-lista { list-style: none; margin: 22px 0 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
  .vz-lista button { font: inherit; font-size: .95rem; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; color: inherit; background: transparent; border: 2px solid currentColor; padding: 10px 22px; }
  .vz-lista button:hover, .vz-lista button:focus { background: rgba(127,127,127,.18); outline: none; }
  #vzVeil { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; box-sizing: border-box; background: rgba(0,0,0,.62); }
  #vzVeil[hidden] { display: none; }
  .vz-card { position: relative; width: min(92vw, 640px); max-height: 82vh; overflow-y: auto; box-sizing: border-box; background: #141414; color: #f5f5f5; border: 2px solid #FFED00; padding: 26px 28px; }
  .vz-card h2 { margin: 0 0 12px; font-size: 1.25rem; letter-spacing: .05em; text-transform: uppercase; }
  .vz-tag { display: inline-block; margin-bottom: 16px; padding: 3px 10px; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: #FFED00; border: 1px solid #FFED00; }
  .vz-card p { margin: 0 0 12px; line-height: 1.55; }
  .vz-card pre { margin: 0 0 4px; white-space: pre-wrap; word-wrap: break-word; font-family: ui-monospace, Consolas, monospace; font-size: .85rem; line-height: 1.5; border-left: 3px solid #FF8C00; padding-left: 14px; }
  .vz-fechar { position: absolute; top: 8px; right: 10px; padding: 8px; font: inherit; font-size: 1.2rem; line-height: 1; cursor: pointer; color: inherit; background: transparent; border: 0; }
  .vz-fechar:hover, .vz-fechar:focus { color: #FFED00; outline: none; }
</style>
